<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hiệu ứng chữ bằng dấu chấm và nền trái tim + nhạc Em dạo này</title>
  <style>
    body {
      background: #181818;
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      position: fixed;
      left: 0; top: 0;
    }
  </style>
</head>
<body>
  <canvas id="heartBg"></canvas>
  <canvas id="dotsCanvas"></canvas>
  <!-- Nhạc nền từ link mp3 online -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://cdn.jsdelivr.net/gh/hatrongnghia/musiccdn@main/EmDaoNay-Ngot.mp3" type="audio/mpeg">
  </audio>
  <script>
    // --------- PHÔNG NỀN TRÁI TIM BAY LÊN ----------
    const bgCanvas = document.getElementById('heartBg');
    const bgCtx = bgCanvas.getContext('2d');
    let BW = window.innerWidth;
    let BH = window.innerHeight;
    function resizeBg() {
      BW = window.innerWidth;
      BH = window.innerHeight;
      bgCanvas.width = BW;
      bgCanvas.height = BH;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function randomPink() {
      const pinks = [
        "#ffb6c1", "#ff69b4", "#ff1493", "#ff6f91", "#e75480", "#f06292", "#ff85a1"
      ];
      return pinks[Math.floor(Math.random()*pinks.length)];
    }
    class Heart {
      constructor() { this.reset(); }
      reset() {
        this.size = 16 + Math.random()*16;
        this.x = Math.random() * BW;
        this.y = BH + Math.random()*BH*0.15;
        this.speed = 0.7 + Math.random()*1.1;
        this.amp = 20 + Math.random()*26;
        this.omega = 0.6 + Math.random()*1.1;
        this.phase = Math.random()*Math.PI*2;
        this.color = randomPink();
        this.alpha = 0.45 + Math.random()*0.45;
        this.angle = Math.random() * Math.PI * 2;
        this.angSpeed = (Math.random()-0.5)*0.009;
      }
      update() {
        this.y -= this.speed;
        this.x += Math.sin(this.phase + this.y * this.omega / 40) * this.amp * 0.008;
        this.angle += this.angSpeed;
        if (this.y < -this.size || this.x < -this.size || this.x > BW+this.size) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.scale(this.size/24, this.size/24);
        ctx.beginPath();
        ctx.moveTo(0, -7);
        ctx.bezierCurveTo(12, -15, 15, 5, 0, 12);
        ctx.bezierCurveTo(-15, 5, -12, -15, 0, -7);
        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }
    }
    const hearts = [];
    for(let i=0; i<42; i++) hearts.push(new Heart());

    function animateHearts() {
      bgCtx.clearRect(0, 0, BW, BH);
      for (let h of hearts) {
        h.update();
        h.draw(bgCtx);
      }
      requestAnimationFrame(animateHearts);
    }
    animateHearts();

    // ----- HIỆU ỨNG CHỮ BẰNG DẤU CHẤM -----
    const TEXTS = [
      "Chúc mừng các bạn nữ ngày 20/10",
      "Nhân ngày này mình xin chúc các bạn",
      "Luôn tự tin, xinh đẹp và hạnh phúc với chính mình",
      "Mạnh mẽ, độc lập nhưng vẫn dịu dàng đúng lúc",
      "Mong mọi điều tốt đẹp sẽ đến với các bạn",
      "Cảm ơn vì đã làm cho thế giới này trở nên tươi sáng hơn mỗi ngày"
    ];
    const FONT = "bold 62px 'Arial Black', Impact, Arial, Helvetica, sans-serif";
    const DOT_SIZE = 4.5;
    const DOT_COLOR = "#ff69b4";
    const DOT_SPACING = 5;
    const MOVE_SPEED = 0.07;
    const SHOW_TIME = 5000;
    const DISPERSING_TIME = 1100;

    const canvas = document.getElementById('dotsCanvas');
    const ctx = canvas.getContext('2d');
    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    window.addEventListener("resize", () => {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      renderTextToDots(currentTextIndex, true, true);
      resizeBg();
    });

    class Dot {
      constructor(x, y) {
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.tx = x;
        this.ty = y;
        this.state = 'gather';
        this.dx = 0;
        this.dy = 0;
      }
      moveToTarget() {
        if (this.state === 'gather') {
          this.x += (this.tx - this.x) * MOVE_SPEED;
          this.y += (this.ty - this.y) * MOVE_SPEED;
        } else if (this.state === 'disperse') {
          this.x += (this.dx - this.x) * 0.09;
          this.y += (this.dy - this.y) * 0.09;
        }
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, DOT_SIZE, 0, 2 * Math.PI);
        ctx.fillStyle = DOT_COLOR;
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 4;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    let dots = [];
    let currentTextIndex = 0;
    let lastSwitch = Date.now();
    let dispersing = false;
    let dispersingStart = 0;

    function wrapText(text, maxWidth, font) {
      const off = document.createElement('canvas');
      const offCtx = off.getContext('2d');
      offCtx.font = font;
      let words = text.split(' ');
      let lines = [];
      let line = '';
      for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = offCtx.measureText(testLine);
        let testWidth = metrics.width;
        if(testWidth > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + ' ';
        }
        else { line = testLine; }
      }
      lines.push(line.trim());
      return lines;
    }

    function renderTextToDots(textIndex, forceRandom = false, forceGather = false) {
      const off = document.createElement('canvas');
      off.width = W;
      off.height = H;
      const offCtx = off.getContext('2d');
      offCtx.clearRect(0, 0, W, H);
      offCtx.font = FONT;
      offCtx.textAlign = "center";
      offCtx.textBaseline = "middle";
      offCtx.fillStyle = "#fff";
      let maxTextWidth = Math.min(W * 0.85, 1200);
      let lines = wrapText(TEXTS[textIndex], maxTextWidth, FONT);
      let lineHeight = 74;
      let midY = H/2 - (lines.length-1)*lineHeight/2;
      for(let i=0; i<lines.length; i++) {
        offCtx.fillText(lines[i], W/2, midY + i*lineHeight);
      }
      const imageData = offCtx.getImageData(0, 0, W, H);
      const data = imageData.data;
      let newTargets = [];
      for(let y=0; y<H; y+=DOT_SPACING) {
        for(let x=0; x<W; x+=DOT_SPACING) {
          let idx = (y*W + x) * 4;
          if(data[idx+3] > 128) newTargets.push({x, y});
        }
      }
      while (dots.length < newTargets.length) dots.push(new Dot(W/2, H/2));
      while (dots.length > newTargets.length) dots.pop();
      for(let i=0; i<newTargets.length; i++) {
        if(forceRandom) {
          dots[i].x = Math.random() * W;
          dots[i].y = Math.random() * H;
        }
        dots[i].tx = newTargets[i].x;
        dots[i].ty = newTargets[i].y;
        if (forceGather) dots[i].state = 'gather';
      }
    }

    function startDispersing() {
      dispersing = true;
      dispersingStart = Date.now();
      for (let dot of dots) {
        dot.state = 'disperse';
        dot.dx = Math.random() * W;
        dot.dy = Math.random() * H;
      }
    }

    function animate() {
      ctx.clearRect(0, 0, W, H);
      for(let dot of dots) {
        dot.moveToTarget();
        dot.draw(ctx);
      }
      let now = Date.now();
      if (!dispersing && now - lastSwitch > SHOW_TIME) startDispersing();
      if (dispersing && now - dispersingStart > DISPERSING_TIME) {
        currentTextIndex = (currentTextIndex + 1) % TEXTS.length;
        renderTextToDots(currentTextIndex, false, true);
        lastSwitch = now;
        dispersing = false;
      }
      requestAnimationFrame(animate);
    }

    renderTextToDots(0, true, true);
    animate();
 </script>

  </body>
</html>
